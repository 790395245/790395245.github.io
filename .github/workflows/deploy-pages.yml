name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # 每次推送到 main 分支时触发部署
    paths-ignore:
      - '.github/**'  # 替换为要排除的文件或文件夹路径
      - 'pages/**'
      - 'public/**'
      - '.vitepress/**'
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REPO_URL: "790395245/790395245.github.io"  # 远程仓库的 URL
      BUILD_PATH: ".vitepress/dist"  # 构建输出路径
      CUSTOM_DOMAIN: "ruo.ge"  # 自定义域名

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 安装 pnpm（固定 v10 大版本，避免上游大版本变动导致 CI 行为漂移）
      - name: Install pnpm
        run: npm install -g pnpm@10

      # 安装依赖并构建项目；输出同时写入日志文件，失败时供注解步骤提取
      - name: Install dependencies and build
        run: |
          set -o pipefail
          (pnpm install && pnpm build) 2>&1 | tee /tmp/build_output.log

      # 构建失败时，把日志末尾内容以 ::error:: 注解形式输出（注解可通过 API 公开读取）
      - name: Surface build errors
        if: failure()
        run: |
          if [ -f /tmp/build_output.log ]; then
            tail -n 40 /tmp/build_output.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line:0:240}"
            done
          fi

      # 将静态文件部署到 pages 分支
      - name: Deploy to GitHub Pages
        run: |
          cd $BUILD_PATH
          echo "$CUSTOM_DOMAIN" > CNAME  # 使用自定义域名
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          # 初始化一个新的 git 仓库
          git init
          git add .
          git commit -m "Deploy to GitHub Pages"
          # 创建 pages 分支（如果不存在）
          git checkout -B pages

          # 添加远程仓库并推送到 pages 分支
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ env.REPO_URL }}.git
          git push --force origin pages

        env:
          CI: true
